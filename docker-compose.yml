# BitNet service: N API replicas behind one nginx address. Each replica runs the model in its own process,
# so RAM use is per replica; the downloaded weights are shared through the models volume.
# Start:  docker compose up -d --build          (callers use http://<host>:29201)
# Scale:  SERVICE_REPLICAS=3 docker compose up -d --build, then: docker compose restart cnv_bitnet2b_model_lb

name: cnv_bitnet2b_model

services:
  cnv_bitnet2b_model:
    build: .
    image: cnv_bitnet2b_model:latest
    restart: unless-stopped
    mem_limit: ${SERVICE_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    stop_grace_period: 90s  # uvicorn lets running calls finish on SIGTERM; Docker's default 10 s would kill a long answer
    environment:
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:-}
      SERVICE_NUM_THREAD: ${SERVICE_NUM_THREAD:-}
      SERVICE_REPLICAS: ${SERVICE_REPLICAS:-1}  # shown read-only on /admin/
    volumes:
      - cnv_bitnet2b_model_models:/models
      - cnv_bitnet2b_model_data:/data
    deploy:
      replicas: ${SERVICE_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29201/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [cnv_bitnet2b_model]

  cnv_bitnet2b_model_lb:
    container_name: cnv_bitnet2b_model_lb
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT:-29201}:29201"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cnv_bitnet2b_model:
        condition: service_healthy
    networks:
      cnv_bitnet2b_model:
      citadel:
        aliases: [cnv_bitnet2b_model_lb]

volumes:
  cnv_bitnet2b_model_models:
    name: cnv_bitnet2b_model_models
  cnv_bitnet2b_model_data:
    name: cnv_bitnet2b_model_data
networks:
  # Other stacks reach http://cnv_bitnet2b_model_lb:29201 by joining this network.
  cnv_bitnet2b_model:
    name: cnv_bitnet2b_model
  citadel:
    name: citadel_core
    external: true
